name: Flasher Pages
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["tools/dual-ota-flasher/**", "tools/meshtastic-flasher/**", ".github/workflows/flasher-pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: "pages", cancel-in-progress: true }

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Stamp build version (commit + date) into the page
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7} $(date -u +%Y-%m-%d)/" tools/dual-ota-flasher/index.html
      # The dual-OTA flasher stays at the site root (existing published URL), with the
      # Meshtastic flasher alongside it at /meshtastic-flasher/. In-repo that page imports the esptool bundle
      # as ../dual-ota-flasher/esptool-bundle.js so it also works when served straight from
      # a checkout, so that one file is duplicated into the artifact to keep the path valid
      # once the root is flattened. Same reason the cross-link loses its ../ here.
      - name: Stage both flasher pages
        run: |
          mkdir -p _site/meshtastic-flasher _site/dual-ota-flasher _site/c3-flasher
          cp -r tools/dual-ota-flasher/. _site/
          cp -r tools/meshtastic-flasher/. _site/meshtastic-flasher/
          cp tools/dual-ota-flasher/esptool-bundle.js _site/dual-ota-flasher/
          sed -i 's|href="../meshtastic-flasher/"|href="meshtastic-flasher/"|' _site/index.html
          # _site/dual-ota-flasher/ holds only the shared bundle, so point the Meshtastic page's
          # back-link at the real root page instead of that stub directory.
          sed -i 's|href="../dual-ota-flasher/"|href="../"|' _site/meshtastic-flasher/index.html
          # Old published URL, kept as a redirect.
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Moved</title>' \
            '<meta http-equiv="refresh" content="0; url=../meshtastic-flasher/">' \
            '<p>Moved to <a href="../meshtastic-flasher/">Meshtastic Flasher</a>.</p>' \
            > _site/c3-flasher/index.html
      - uses: actions/configure-pages@v5
        with: { enablement: true }   # create/enable the Pages site if it doesn't exist yet
      - uses: actions/upload-pages-artifact@v3
        with: { path: "_site" }
      - id: deployment
        uses: actions/deploy-pages@v4
